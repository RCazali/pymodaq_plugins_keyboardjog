[features]  # defines the plugin features contained into this plugin
instruments = false  # true if plugin contains instrument classes (else false, notice the lowercase for toml files)
extensions = true  # true if plugins contains dashboard extensions
models = false  # true if plugins contains models of the extensions (PID, optimizers, data mixer, sequencer, ...)
h5exporters = false  # true if plugin contains custom h5 file exporters
scanners = false  # true if plugin contains custom scan layout (daq_scan extensions)

[urls]
package-url = 'https://github.com/PyMoDAQ/pymodaq_plugins_keyboardjog'

[project]
name = "pymodaq_plugins_keyboardjog"
description = 'Keyboard Jog: a tiny always-on-top Dashboard extension to move the actuators with the keyboard'
dependencies = [
    "pymodaq>=5.1.0",  # tested with PyMoDAQ 5.1.10 (PyQt5) and 5.3.4 (PyQt6)
    "pymodaq_utils>=5.1.0",
    "pymodaq_gui>=5.1.0",
]

authors = [
    {name = "RCazali", email = "romcazali@gmail.com"},
]
maintainers = [
    {name = "RCazali", email = "romcazali@gmail.com"},
]

# nottodo: leave everything below as is!

dynamic = ["version", "urls", "entry-points", "classifiers"]
readme = "README.rst"
license = { file="LICENSE" }
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[build-system]
requires = [
    "hatchling>=1.9.0",
    "hatch-vcs", "toml",
    "pymodaq_utils>=5.3.6",
]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pymodaq: integration tests that create real PyMoDAQ control modules (Mock actuators) and a Qt application",
]

[tool.pymodaq]
# the "Operating System" and "Programming Language :: Python :: 3.x" classifiers are added when building the package,
# from supported_platforms in your instrument plugins and from requires-python
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: User Interfaces",
]
